<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | ServiceDesk Lite</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <script src="../static/js/theme.js"></script>
    <script defer src="../static/js/language.js"></script>
    <script defer src="../static/js/demo-data.js"></script>
</head>

<body data-page="login" data-root="./">
    <div id="app"></div>
    <section class="login-layout">
        <div class="login-intro"><span class="eyebrow" data-i18n="welcomeBack">WELCOME BACK</span>
            <h1 data-i18n="loginHeadline">Less waiting.<br>More doing.</h1>
            <p data-i18n="loginDescription">Your next solution starts here. Step into a workspace that keeps support
                simple.</p>
            <div class="login-decoration"><span>↗</span>
                <blockquote data-i18n="loginQuote">The right help.<br>Right when you need it.</blockquote>
                <small>ServiceDesk Lite</small>
            </div>
        </div>
        <div class="card login-card">
            <h2 data-i18n="signIn">Sign in to your workspace</h2>
            <form id="login-form" method="POST">
                {% csrf_token %}
                <div class="form-field">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>

                <div class="form-field">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button class="button primary full-width" type="submit" data-i18n="loginButton">تسجيل الدخول</button>
            </form><a class="back-link" data-link="index.html" data-i18n="backHome">← Back to home</a>
        </div>
    </section>

</body>

</html>
